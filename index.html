<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nightwatch</title>
  <meta name="description" content="Offline-first sleep tracker — log wake, bedtime, and naps; forecast the next ones." />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nightwatch" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111'/><circle cx='22' cy='10' r='5' fill='%234f46e5'/><circle cx='14' cy='18' r='6' fill='none' stroke='%234f46e5' stroke-width='2'/></svg>" />
  <!--
    PWA manifest and service-worker registration are intentionally OMITTED
    in Phase 1; they land in Phase 8 (PWA hardening) so the data model can
    flex during Phases 1-4 without service-worker churn.
  -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    App header (Plan 02-04 / D2-10). h1.subjectName is populated by
    js/ui/header.js via .textContent (T-07 / Pitfall #5 — never innerHTML).
    The gear button opens the Settings modal via dialog.showModal(). The
    SVG icon is inline (no external asset) so the header has no network
    dependency. min-width/height 44px on the trigger satisfies tap target.
  -->
  <!--
    App header (Plan 02-04 / D2-10; Plan 04-02 / D4-07).
    h1.subjectName: populated by js/ui/header.js via .textContent (T-07).
    nav.tabNav: two-tab header navigation (Today | History) per D4-07.
    The gear button opens the Settings modal via dialog.showModal().
    Tab buttons carry data-tab and aria-selected; header.js wires the click
    handler and updates aria-selected state dynamically.
  -->
  <header class="appHeader">
    <h1 class="subjectName"></h1>
    <nav class="tabNav" role="tablist" aria-label="Screen navigation">
      <button type="button" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
    </nav>
    <button type="button" class="settingsTrigger" aria-label="Settings">
      <!-- Settings gear: Material Icons (Apache 2.0). Inline path keeps zero-deps constraint. -->
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94 0 .31.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/>
      </svg>
    </button>
  </header>

  <!--
    Main content area with two screens (Plan 04-02 / D4-07).
    app.js toggles display on today-screen / history-screen based on activeTab.
    The no-JS skeleton lives inside today-screen so the quick-log buttons
    are still accessible when JS is disabled. History screen is hidden by
    default (display:none via style attribute + JS-controlled toggle).
  -->
  <main id="app">
    <!--
      Today screen (Plan 01-03 / D-10; Plan 03-04 forecast section).
      js/ui/today-screen.js calls root.replaceChildren(...) on mount, so the
      skeleton below is shown only momentarily during module loading and as a
      progressive-enhancement fallback when JS is disabled.
      D3-07 layout order: Quick-log → hero card → cold-start → forecast grid →
                          grouping toggle → day list → add button.
    -->
    <section id="today-screen">
      <div class="quickLog">
        <button type="button" data-log="wake">Woke up</button>
        <button type="button" data-log="bedtime">Going to sleep</button>
        <button type="button" data-log="napStart">Nap start</button>
        <button type="button" data-log="napEnd">Nap end</button>
      </div>
      <div id="next-event-card"></div>
      <div id="cold-start-message"></div>
      <section id="forecast-cards" class="forecast-grid"></section>
      <section class="dayList" data-role="events"></section>
      <button type="button" id="addEventBtn" class="addEventBtn">+ Add event</button>
    </section>

    <!--
      History screen (Plan 04-02 / D4-01, D4-07). Initially hidden; shown
      when user clicks the History tab. history-screen.js mounts the
      day-column table inside the root div via replaceChildren().
    -->
    <section id="history-screen" style="display: none;">
      <div id="history-table-root"></div>
    </section>
  </main>

  <!--
    Manual-entry modal (Plan 01-04 / D-10 trigger, D-12 affordance reuse, D-13
    field shape, D-14 two-number HH+MM picker, RESEARCH §Pattern 6 native
    <dialog>). The form uses method="dialog" so the Save button's
    `value="save"` becomes the close returnValue; manual-entry.js dispatches
    onSave only when returnValue === 'save'. Native showModal() gives us
    focus trap + ESC-to-close + aria-modal automatically (V14 zero-deps
    accessibility).
  -->
  <dialog id="manualEntry" aria-labelledby="manualEntryTitle">
    <form method="dialog">
      <h2 id="manualEntryTitle">Add event</h2>
      <label>
        Date
        <input type="date" name="date" required>
      </label>
      <label>
        Hour
        <input type="number" name="hour" min="0" max="23" required>
      </label>
      <label>
        Minute
        <input type="number" name="minute" min="0" max="55" step="5" required>
      </label>
      <small class="hint">Times are stored in 5-minute increments.</small>
      <label>
        Type
        <select name="type" required>
          <option value="wake">Wake</option>
          <option value="bedtime">Bedtime</option>
          <option value="napStart">Nap start</option>
          <option value="napEnd">Nap end</option>
        </select>
      </label>
      <!--
        Plan 01-07 — inline validation surface (UAT gaps 2 + 3 closure).
        js/ui/manual-entry.js writes per-field error <p> children into this
        block via el({ textContent }) (T-07: never innerHTML). aria-live
        announces errors to screen readers when they appear. The block is
        hidden via :empty CSS when no errors are present.
      -->
      <output id="manualEntryErrors" class="manualEntryErrors" aria-live="polite"></output>
      <menu>
        <button type="button" id="manualCancel" formnovalidate>Cancel</button>
        <!--
          formnovalidate on Save: the HTML5 step="5" constraint on the minute
          input would block form submission for non-5 multiples, but the
          modal's contract (Open Question #2 + LOG-07) is to SILENTLY round
          to the nearest 5. The JS submit handler in js/ui/manual-entry.js
          normalizes via Math.round(rawMinute / 5) * 5; the store re-rounds
          again via roundTo5 as the second layer of defense. The min/max
          bounds (0-23 hour, 0-55 minute) and required field checks still
          fire because formnovalidate is per-button; the input's own
          ::invalid styling still surfaces the out-of-step value as a hint.
        -->
        <button type="submit" value="save" formnovalidate>Save</button>
      </menu>
    </form>
  </dialog>

  <!--
    Settings modal (Plan 02-04 / D2-12, D2-13, D2-14). Native <dialog> mirrors
    the manualEntry pattern: form method="dialog", Save submit fires close
    with returnValue='save', Cancel/ESC fire close with empty returnValue.
    Three fieldsets group the 9 settings (Profile / Time & Day / Forecast
    tuning per D2-13 — NO welcome banner). The settingsErrors <output>
    block uses aria-live="polite" and renders one <p data-field=...> per
    error via .textContent (T-07).
  -->
  <dialog id="settings" aria-labelledby="settingsTitle">
    <form method="dialog">
      <h2 id="settingsTitle">Settings</h2>

      <fieldset>
        <legend>Profile</legend>
        <label>
          Subject name
          <input type="text" name="subjectName" maxlength="40" placeholder="e.g., Baby, Maya, Liam...">
        </label>
      </fieldset>

      <fieldset>
        <legend>Time &amp; Day</legend>
        <label>
          Day cutover hour
          <input type="number" name="cutoverHour" min="0" max="23">
        </label>
        <label>
          View grouping
          <select name="groupingMode">
            <option value="calendar">Calendar day</option>
            <option value="sleepCycle">Sleep cycle</option>
          </select>
        </label>
        <label>
          Time format
          <select name="timeFormat">
            <option value="24h">24-hour</option>
            <option value="12h">12-hour</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Forecast tuning</legend>
        <label class="checkboxRow">
          <input type="checkbox" name="autoOutlier">
          Auto outlier detection
        </label>
        <label>
          Max delta (minutes)
          <input type="number" name="maxDelta" min="5" max="120">
        </label>
        <label>
          Min days of history
          <input type="number" name="minDays" min="1" max="90">
        </label>
        <label>
          Rolling window (days)
          <input type="number" name="windowDays" min="3" max="90">
        </label>
        <label>
          Statistical blend
          <select name="statBlend">
            <option value="median">Median</option>
            <option value="mean">Mean</option>
            <option value="blend">Blend</option>
          </select>
        </label>
      </fieldset>

      <output id="settingsErrors" class="settingsErrors" aria-live="polite"></output>

      <!-- Import / Export section (Plan 05-04, D5-01, D5-03) -->
      <fieldset>
        <legend>Import / Export</legend>
        <p class="importHelp">Replace all data by importing a CSV or JSON file. Export the current dataset as a dated JSON backup.</p>
        <button type="button" id="importCsvBtn" class="btnImport">Import CSV</button>
        <button type="button" id="importJsonBtn" class="btnImport">Import JSON</button>
        <p id="importStatus" class="importStatus" aria-live="polite"></p>
      </fieldset>

      <menu>
        <button type="button" id="settingsCancel" formnovalidate>Cancel</button>
        <!--
          formnovalidate on Save: HTML5 min/max on the number inputs would
          block submission before validateSettings could surface a structured
          error in <output id="settingsErrors">. Mirrors the same idiom on
          #manualEntry's Save (LOG-07 silent rounding) — the JS validator is
          the source of truth; HTML attributes are belt-and-suspenders hints.
        -->
        <button type="submit" value="save" formnovalidate>Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Hidden file inputs for import (Plan 05-04 / D5-01). Triggered programmatically
       by the Settings modal import buttons; never visible to the user directly. -->
  <input type="file" id="csvInput" accept=".csv,text/csv" style="display:none">
  <input type="file" id="jsonInput" accept=".json,application/json" style="display:none">

  <script type="module" src="js/app.js"></script>
</body>
</html>
