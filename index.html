<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nightwatch</title>
  <meta name="description" content="Offline-first sleep tracker — log wake, bedtime, and naps; forecast the next ones." />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nightwatch" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111'/><circle cx='22' cy='10' r='5' fill='%234f46e5'/><circle cx='14' cy='18' r='6' fill='none' stroke='%234f46e5' stroke-width='2'/></svg>" />
  <!--
    PWA manifest and service-worker registration are intentionally OMITTED
    in Phase 1; they land in Phase 8 (PWA hardening) so the data model can
    flex during Phases 1-4 without service-worker churn.
  -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    No-JS / pre-hydration skeleton (Plan 01-03 / D-10).
    js/ui/today-screen.js calls root.replaceChildren(...) on mount, so this
    skeleton is shown only momentarily during module loading and as a
    progressive-enhancement fallback when JS is disabled. The data-log
    attributes here match the four valid types in VALID_TYPES (T-01 contract).
  -->
  <main id="app">
    <div class="quickLog">
      <button type="button" data-log="wake">Woke up</button>
      <button type="button" data-log="bedtime">Going to sleep</button>
      <button type="button" data-log="napStart">Nap start</button>
      <button type="button" data-log="napEnd">Nap end</button>
    </div>
    <section class="dayList" data-role="events"></section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
