# .github/workflows/ci.yml
# Sources:
#   - playwright.dev/docs/ci-intro
#   - D-21 in .planning/phases/NW-01-log-persist/01-CONTEXT.md
#
# Runs unit + integration (node --test) then E2E (Playwright) on push & PR.
# Same workflow file is reused unchanged through Phase 8.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dev dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Supply-chain check (T-08, D-20)
        # Fail-fast: reject any PR that introduces a runtime dependency before
        # spending time on the test suite. See .planning/REQUIREMENTS.md
        # (PLAT-11) and .planning/phases/NW-01-log-persist/01-CONTEXT.md (D-20).
        run: node -e "const p=require('./package.json'); const n=Object.keys(p.dependencies||{}).length; if(n>0){console.error('Runtime deps not allowed: '+n+' found'); process.exit(1)} else console.log('OK: zero runtime deps')"
      - name: Run unit + integration tests (node:test)
        run: node --test
      - name: Run E2E tests (Playwright)
        run: npx playwright test
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
